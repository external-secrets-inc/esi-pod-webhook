{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "esi-pod-webhook.serviceAccountName" . }}
  namespace: {{ include "esi-pod-webhook.namespace" . }}
  labels:
    {{- include "esi-pod-webhook.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end -}}
