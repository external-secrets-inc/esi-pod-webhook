{{- if .Values.rbac.create -}}
apiVersion: {{ include "esi-pod-webhook.rbac.apiVersion" . }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "esi-pod-webhook.fullname" . }}-webhook
  labels:
    {{- include "esi-pod-webhook.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "esi-pod-webhook.serviceAccountName" . }}
    namespace: {{ include "esi-pod-webhook.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "esi-pod-webhook.fullname" . }}-webhook
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
