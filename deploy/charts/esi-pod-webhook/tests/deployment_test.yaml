# Test suite for the Deployment resource

suite: test deployment
release:
  name: my-release
  namespace: my-namespace
chart:
  version: 0.1.0
  appVersion: v0.1.0 # Make sure this matches Chart.yaml's appVersion

values:
  # Minimal values to render the deployment
  - ../values.yaml # Include default values from the chart

tests:
  - it: should render the deployment with default values (debug enabled)
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: my-release-esi-pod-webhook
      - equal:
          path: metadata.namespace
          value: my-namespace
      - equal:
          path: spec.replicas
          value: 1 # From default values.yaml
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: esi-pod-webhook
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: esi-pod-webhook
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-release-esi-pod-webhook # Default SA name
      - equal:
          path: spec.template.spec.containers[0].name
          value: webhook
      - equal:
          path: spec.template.spec.containers[0].image
          # Default tag is empty, so it should fall back to chart's appVersion
          value: "us-central1-docker.pkg.dev/external-secrets-inc-registry/external/esi-pod-webhook:v0.1.0"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent # From default values.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--port=8443"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--tls-cert=/etc/webhook/certs/tls.crt"
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: webhook
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8443
      - equal:
          path: spec.template.spec.containers[0].ports[1].name # Debug port
          value: debug
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 40000
      - equal:
          path: spec.template.spec.volumes[0].name
          value: webhook-certs
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: esi-pod-webhook-cert # Default from values.yaml
      - hasDocuments:
          count: 1

  - it: should render deployment with debug explicitly enabled
    template: templates/deployment.yaml
    set:
      debug.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: debug
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 40000 # Value from debug.container.port

  - it: should render deployment without debug port when debug.enabled is false
    template: templates/deployment.yaml
    set:
      debug.enabled: false
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: webhook
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: webhook
              containerPort: 8443
              protocol: TCP
      - notExists:
          path: spec.template.spec.containers[0].ports[1] # Debug port should not exist

  - it: should use specified image tag when image.tag is set
    template: templates/deployment.yaml
    set:
      image.tag: "custom-tag"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "us-central1-docker.pkg.dev/external-secrets-inc-registry/external/esi-pod-webhook:custom-tag"

  - it: should override replicaCount
    template: templates/deployment.yaml
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should set pod annotations
    template: templates/deployment.yaml
    set:
      podAnnotations:
        my-custom-annotation: my-value
    asserts:
      - equal:
          path: spec.template.metadata.annotations["my-custom-annotation"]
          value: my-value
      - equal:
          path: spec.template.metadata.annotations["secretless.externalsecrets.com/skip"]
          value: "true" # Ensure default one is still there

  - it: should configure security contexts
    template: templates/deployment.yaml
    set:
      podSecurityContext:
        runAsUser: 2000
      securityContext:
        runAsGroup: 3000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 2000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 3000
