apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: esi-pod-webhook
  annotations:
    cert-manager.io/inject-ca-from: secretless-system/esi-pod-webhook-cert
webhooks:
  - name: esi-pod-webhook.secretless-system.svc
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["secretless-system"]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: "Namespaced"
    clientConfig:
      service:
        name: esi-pod-webhook
        namespace: secretless-system
        path: "/mutate"
        port: 8443
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    failurePolicy: Fail
---
apiVersion: v1
kind: Service
metadata:
  name: esi-pod-webhook
  namespace: secretless-system
spec:
  ports:
  - name: webhook
    port: 8443
    targetPort: webhook
  - name: debug
    port: 40000
    targetPort: debug
  selector:
    app: esi-pod-webhook
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: esi-pod-webhook
  namespace: secretless-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secretless-webhook
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["secretstores", "externalsecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secretless-webhook
subjects:
  - kind: ServiceAccount
    name: esi-pod-webhook
    namespace: secretless-system
roleRef:
  kind: ClusterRole
  name: secretless-webhook
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esi-pod-webhook
  namespace: secretless-system
  labels:
    app: esi-pod-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esi-pod-webhook
  template:
    metadata:
      labels:
        app: esi-pod-webhook
      annotations:
        secretless.externalsecrets.com/skip: "true"
    spec:
      serviceAccountName: esi-pod-webhook
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: secretless-webhook:latest5
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8443
              name: webhook
              protocol: TCP
            - containerPort: 40000
              name: debug
              protocol: TCP
          # Pass TLS cert/key as arguments to the webhook through dlv
          args:
            - "--tls-cert=/etc/webhook/certs/tls.crt"
            - "--tls-key=/etc/webhook/certs/tls.key"
            - "--port=8443"
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: webhook-certs
          secret:
            secretName: esi-pod-webhook-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: esi-pod-webhook-cert
  namespace: secretless-system
spec:
  dnsNames:
    - esi-pod-webhook.secretless-system.svc
    - esi-pod-webhook.secretless-system.svc.cluster.local
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-issuer
  secretName: esi-pod-webhook-cert
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
