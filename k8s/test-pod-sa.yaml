apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-pod-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-pod-role
  namespace: default
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-pod-role-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: test-pod-sa
    namespace: default
roleRef:
  kind: Role
  name: test-pod-role
  apiGroup: rbac.authorization.k8s.io
