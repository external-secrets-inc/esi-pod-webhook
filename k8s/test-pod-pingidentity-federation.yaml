apiVersion: v1
kind: Pod
metadata:
  name: test-pod-pingidentity
  namespace: default
  labels:
    app: test-pod-pingidentity
  annotations:
    # External secret to inject
    secretless.externalsecrets.com/externalsecret: "test-app-secrets"
    
    # Use init container mode with environment variable injection
    secretless.externalsecrets.com/env-vars: "true"
    
    # Federation server configuration
    secretless.externalsecrets.com/federated-server-url: "http://federation-server.external-secrets-system:8080"
    secretless.externalsecrets.com/federated-auth: "pingidentity"
    
    # PingIdentity authentication parameters
    # Note: In production, use Secrets mounted as volumes instead of hardcoded values
    secretless.externalsecrets.com/pingidentity-client-id: "12345678-1234-1234-1234-123456789abc"
    secretless.externalsecrets.com/pingidentity-private-key: "/pingidentity/private_key.pem"
    secretless.externalsecrets.com/pingidentity-region: "com"  # Options: com, eu, asia, ca
    secretless.externalsecrets.com/pingidentity-environment-id: "87654321-4321-4321-4321-cba987654321"
    # secretless.externalsecrets.com/pingidentity-scopes: "openid profile"  # Optional: specify scopes if needed
    
    # Optional: Specify custom environment variable mapping
    # secretless.externalsecrets.com/inject-on-env: "DB_PASSWORD=vault-backend.database-password"
spec:
  containers:
  - name: app
    image: busybox
    command: ["/bin/sh", "-c", "while true; do env | grep -E '(API|DB|SECRET)'; sleep 10; done"]
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 50m
        memory: 32Mi
    # Mount PingIdentity private key from ConfigMap or Secret
    volumeMounts:
    - name: pingidentity-key
      mountPath: /pingidentity
      readOnly: true
  
  volumes:
  - name: pingidentity-key
    secret:
      secretName: pingidentity-private-key
      items:
      - key: private_key.pem
        path: private_key.pem
        mode: 0400

---
# Example Secret containing the PingIdentity private key
# In production, create this using kubectl create secret or via a secure method
apiVersion: v1
kind: Secret
metadata:
  name: pingidentity-private-key
  namespace: default
type: Opaque
stringData:
  private_key.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    # REPLACE WITH YOUR ACTUAL PRIVATE KEY
    # This should match the public key registered in your PingOne application
    -----END RSA PRIVATE KEY-----
