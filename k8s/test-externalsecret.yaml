apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: test-app-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: test-app-secrets
  data:
  - secretKey: API_KEY
    remoteRef:
      key: test-app/config
      property: API_KEY
  - secretKey: API_SECRET
    remoteRef:
      key: test-app/config
      property: API_SECRET
