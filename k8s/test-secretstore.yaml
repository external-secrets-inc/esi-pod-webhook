apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretstore
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secret-access-keys
            key: access-key
          secretAccessKeySecretRef:
            name: aws-secret-access-keys
            key: secret-access-key
