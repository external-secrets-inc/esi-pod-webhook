name: Build and Publish new release

on:
  release:
    types: [published]

env:
  NAME: secretless-webhook
  TAG_NAME: ${{ github.event.release.tag_name }}

jobs:
  push-helm:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Google Cloud authentication
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: access_token
        workload_identity_provider: ${{ vars.DEV_IDENTITY_POOL }}
        service_account: ${{ vars.DEV_CI_SERVICE_ACCOUNT }}
        access_token_lifetime: 300s

    - name: Login to Artifact Registry
      uses: docker/login-action@v1
      with:
        registry: us-central1-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - uses: azure/setup-helm@v4.2.0
      with:
        version: 'latest'
  
    - name: Build and push helm chart
      run: make helm.push
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  build-and-push:
    uses: external-secrets-inc/actions/.github/workflows/publish.yml@main
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
        - dockerfile: "Dockerfile"
          build-args: "CGO_ENABLED=0"
          build-arch: "amd64 arm64"
          build-platform: "linux/amd64,linux/arm64"
          tag-suffix: "" # distroless
    with:
      image-tag: ${{ github.event.release.tag_name }}
      dockerfile: ${{ matrix.dockerfile }}
      tag-suffix: ${{ matrix.tag-suffix }}
      image-name: us-central1-docker.pkg.dev/external-secrets-inc-registry/public/secretless-webhook
      build-platform: ${{ matrix.build-platform }}
      build-args: ${{ matrix.build-args }}
      build-arch: ${{ matrix.build-arch }}
      name: "secretless-webhook"
      ref: ${{ github.ref }}
    secrets:
      ESI_BOT_PRIVATE_KEY: ${{ secrets.ESI_BOT_PRIVATE_KEY }}
  publish-manifests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.ref }}
    - name: Set up Google Cloud authentication
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: access_token
        workload_identity_provider: ${{ vars.DEV_IDENTITY_POOL }}
        service_account: ${{ vars.DEV_CI_SERVICE_ACCOUNT }}
        access_token_lifetime: 1800s
    - name: Login to github app
      uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: ${{ vars.ESI_BOT_APP_ID }}
        private-key: ${{ secrets.ESI_BOT_PRIVATE_KEY }}
        owner: external-secrets-inc

    - name: Setup access for private go modules
      run: |
            echo -e "machine github.com login external-secrets-bot[bot] password ${{ steps.app-token.outputs.token }}" >> ~/.netrc

    - name: Build And Publish Manifests - Latest
      run: |
        make build-installer IMG=${{ vars.EXTERNAL_REGISTRY}}/${{ env.NAME }}:latest
        gcloud storage cp dist/install.yaml gs://${{ vars.PROD_BUCKET_CDN }}/${{ env.NAME }}/manifests/latest/install.yaml
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        GOPRIVATE: github.com/external-secrets-inc/*

    - name: Build And Publish Manifests - SemVer
      run: |
        make build-installer IMG=${{ vars.EXTERNAL_REGISTRY}}/${{ env.NAME }}:${{ env.TAG_NAME }} 
        gcloud storage cp dist/install.yaml gs://${{ vars.PROD_BUCKET_CDN }}/${{ env.NAME }}/manifests/${{ env.TAG_NAME }}/install.yaml
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        GOPRIVATE: github.com/external-secrets-inc/*