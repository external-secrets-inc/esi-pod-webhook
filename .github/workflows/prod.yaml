name: Build and Publish new release

on:
  release:
    types: [published]

env:
  NAME: esi-pod-webhook
  TAG_NAME: ${{ github.event.release.tag_name }}

jobs:
  push-helm:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Google Cloud authentication
      id: auth
      uses: google-github-actions/auth@v3
      with:
        token_format: access_token
        workload_identity_provider: ${{ vars.DEV_IDENTITY_POOL }}
        service_account: ${{ vars.DEV_CI_SERVICE_ACCOUNT }}
        access_token_lifetime: 300s

    - name: Login to Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: us-central1-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - uses: azure/setup-helm@v4.3.1
      with:
        version: 'v3.17.3'
  
    - name: Build and push helm chart
      run: make helm.push
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  build-and-push:
    uses: external-secrets-inc/actions/.github/workflows/publish.yml@main
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
        - dockerfile: "Dockerfile"
          build-args: "CGO_ENABLED=0"
          build-arch: "amd64 arm64"
          build-platform: "linux/amd64,linux/arm64"
          tag-suffix: "" # distroless
    with:
      image-tag: ${{ github.event.release.tag_name }}
      dockerfile: ${{ matrix.dockerfile }}
      tag-suffix: ${{ matrix.tag-suffix }}
      image-name: us-central1-docker.pkg.dev/external-secrets-inc-registry/external/esi-pod-webhook
      build-platform: ${{ matrix.build-platform }}
      build-args: ${{ matrix.build-args }}
      build-arch: ${{ matrix.build-arch }}
      name: "esi-pod-webhook"
      ref: ${{ github.ref }}
    secrets:
      ESI_BOT_PRIVATE_KEY: ${{ secrets.ESI_BOT_PRIVATE_KEY }}

  build-and-push-public:
    uses: external-secrets-inc/actions/.github/workflows/publish.yml@main
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
        - dockerfile: "Dockerfile"
          build-args: "CGO_ENABLED=0"
          build-arch: "amd64 arm64"
          build-platform: "linux/amd64,linux/arm64"
          tag-suffix: "" # distroless
    with:
      image-tag: ${{ github.event.release.tag_name }}
      dockerfile: ${{ matrix.dockerfile }}
      tag-suffix: ${{ matrix.tag-suffix }}
      image-name: us-central1-docker.pkg.dev/external-secrets-inc-registry/public/esi-pod-webhook
      build-platform: ${{ matrix.build-platform }}
      build-args: ${{ matrix.build-args }}
      build-arch: ${{ matrix.build-arch }}
      name: "esi-pod-webhook"
      ref: ${{ github.ref }}
    secrets:
      ESI_BOT_PRIVATE_KEY: ${{ secrets.ESI_BOT_PRIVATE_KEY }}